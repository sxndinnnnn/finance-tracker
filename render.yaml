services:
  - type: web
    name: finance-tracker-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /health
    envVars:
      # Set to your Supabase connection string (direct connection, port
      # 5432 — not the pooler) in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      # Set to your deployed Vercel URL(s) once known, e.g.
      # https://finance-tracker.vercel.app — comma-separated for more than one.
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: REMINDER_CHECK_HOUR_UTC
        value: "8"
      - key: DEFAULT_REMINDER_DAYS_BEFORE
        value: "3"
